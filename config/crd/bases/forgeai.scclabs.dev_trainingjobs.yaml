---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.22.0
  name: trainingjobs.forgeai.scclabs.dev
spec:
  group: forgeai.scclabs.dev
  names:
    categories:
    - forgeai
    kind: TrainingJob
    listKind: TrainingJobList
    plural: trainingjobs
    shortNames:
    - ftj
    singular: trainingjob
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.userID
      name: User
      priority: 1
      type: string
    - jsonPath: .spec.jobID
      name: Job
      type: string
    - jsonPath: .spec.resourceID
      name: Resource
      type: string
    - jsonPath: .spec.workers
      name: Workers
      type: integer
    - jsonPath: .status.phase
      name: Phase
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          TrainingJob is a distributed training job built on Kubeflow Trainer + Kueue,
          with per-worker SSH and Jupyter access.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: spec defines the desired state of TrainingJob
            properties:
              access:
                description: access controls SSH / Jupyter endpoints.
                properties:
                  jupyter:
                    default: true
                    description: jupyter creates a Service + Ingress per worker on
                      port 1888.
                    type: boolean
                  ssh:
                    default: true
                    description: ssh creates a sshpiper Pipe per worker (username
                      root@{jobID}-{index}).
                    type: boolean
                type: object
              command:
                description: command is a bash script run in every worker. When empty
                  the image entrypoint is used.
                type: string
              env:
                description: env is injected into every worker.
                items:
                  description: EnvVar is a plain name/value environment variable.
                  properties:
                    name:
                      type: string
                    value:
                      type: string
                  required:
                  - name
                  type: object
                type: array
              image:
                description: image is the container image for every worker.
                minLength: 1
                type: string
              jobID:
                description: jobID is the user-facing job ID, unique per user.
                maxLength: 40
                pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?$
                type: string
              poolID:
                default: default
                description: poolID selects the node pool (scclabs.dev/pool label).
                type: string
              queueName:
                description: queueName is the Kueue LocalQueue; defaults to the platform
                  default queue.
                type: string
              resourceID:
                description: resourceID references a resource model in the platform
                  config.
                minLength: 1
                type: string
              restartGeneration:
                description: restartGeneration triggers a restart when incremented.
                format: int64
                type: integer
              suspend:
                description: |-
                  suspend stops the job: the underlying TrainJob and its pods are deleted,
                  access endpoints are removed, the spec is kept so it can be started again.
                type: boolean
              userGroup:
                description: userGroup is propagated as the user.scclabs.dev/group
                  label.
                type: string
              userID:
                description: userID is the platform user that owns this job.
                minLength: 1
                type: string
              volumeMounts:
                description: volumeMounts mounts user PVCs into every worker.
                items:
                  description: VolumeMount mounts a user volume (PVC) into every worker.
                  properties:
                    claimName:
                      description: claimName overrides the derived PVC name.
                      type: string
                    mountPath:
                      type: string
                    readOnly:
                      type: boolean
                    subPath:
                      type: string
                    userID:
                      description: userID owns the volume; defaults to the job's userID
                        (shared volumes may belong to another user).
                      type: string
                    volumeID:
                      description: |-
                        volumeID is the platform volume ID. The PVC name is derived as p-{userHash}-{volumeID}
                        unless claimName is set.
                      type: string
                  required:
                  - mountPath
                  - volumeID
                  type: object
                type: array
              workers:
                default: 1
                description: workers is the number of nodes (one pod per node).
                format: int32
                minimum: 1
                type: integer
            required:
            - image
            - jobID
            - resourceID
            - userID
            type: object
          status:
            description: status defines the observed state of TrainingJob
            properties:
              active:
                description: Aggregated counts over the batch Jobs created by the
                  JobSet.
                format: int32
                type: integer
              completionTime:
                format: date-time
                type: string
              conditions:
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              failed:
                format: int32
                type: integer
              message:
                description: message gives detail on the current phase.
                type: string
              observedGeneration:
                format: int64
                type: integer
              observedRestartGeneration:
                description: observedRestartGeneration is the last restartGeneration
                  that was acted upon.
                format: int64
                type: integer
              phase:
                description: TrainingJobPhase is a high level summary of the job lifecycle.
                enum:
                - Pending
                - Queued
                - Running
                - Succeeded
                - Failed
                - Stopping
                - Stopped
                - Restarting
                type: string
              ready:
                format: int32
                type: integer
              startTime:
                format: date-time
                type: string
              succeeded:
                format: int32
                type: integer
              trainJobName:
                description: trainJobName is the Kubeflow TrainJob backing this job.
                type: string
              workers:
                items:
                  description: WorkerStatus describes one worker pod.
                  properties:
                    index:
                      format: int32
                      type: integer
                    jupyterURLs:
                      description: jupyterURLs are the ingress URLs for this worker.
                      items:
                        type: string
                      type: array
                    nodeIP:
                      type: string
                    nodeName:
                      type: string
                    phase:
                      description: phase is the pod phase.
                      type: string
                    podIP:
                      type: string
                    podName:
                      type: string
                    sshUser:
                      description: sshUser is the sshpiper username for this worker.
                      type: string
                  required:
                  - index
                  type: object
                type: array
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources:
      status: {}
