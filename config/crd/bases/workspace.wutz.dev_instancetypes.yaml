---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.22.0
  name: instancetypes.workspace.wutz.dev
spec:
  group: workspace.wutz.dev
  names:
    categories:
    - project
    kind: InstanceType
    listKind: InstanceTypeList
    plural: instancetypes
    shortNames:
    - fit
    singular: instancetype
  scope: Cluster
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.gpu.product
      name: GPU
      type: string
    - jsonPath: .spec.gpu.count
      name: GPUs
      type: integer
    - jsonPath: .spec.cpu
      name: CPU
      type: string
    - jsonPath: .spec.memory
      name: Memory
      type: string
    - jsonPath: .status.free
      name: Free
      type: integer
    - jsonPath: .status.total
      name: Total
      type: integer
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          InstanceType is a GPU instance size, generated by the operator from the
          GPU nodes of the cluster.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: spec defines the desired state of InstanceType
            properties:
              cpu:
                anyOf:
                - type: integer
                - type: string
                description: |-
                  cpu and memory per worker: the per-GPU slice of the smallest node in
                  the class (allocatable minus the platform reservation) times gpu.count.
                pattern: ^(\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))(([KMGTPE]i)|[numkMGTPE]|([eE](\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))))?$
                x-kubernetes-int-or-string: true
              gpu:
                description: InstanceTypeGPU describes the GPUs of an instance type.
                properties:
                  class:
                    description: |-
                      class is the normalised GPU product, e.g. rtx-5090. It is also the
                      Kueue ResourceFlavor name.
                    type: string
                  count:
                    description: count is the number of GPUs per worker.
                    format: int32
                    type: integer
                  memoryMiB:
                    description: memoryMiB is the memory of one GPU.
                    format: int64
                    type: integer
                  product:
                    description: product is the nvidia.com/gpu.product node label
                      value.
                    type: string
                required:
                - class
                - count
                - product
                type: object
              memory:
                anyOf:
                - type: integer
                - type: string
                pattern: ^(\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))(([KMGTPE]i)|[numkMGTPE]|([eE](\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))))?$
                x-kubernetes-int-or-string: true
              nodeSelector:
                additionalProperties:
                  type: string
                description: nodeSelector places workers on nodes of this class.
                type: object
            required:
            - cpu
            - gpu
            - memory
            - nodeSelector
            type: object
          status:
            description: status defines the observed state of InstanceType
            properties:
              free:
                description: free is how many instances fit right now.
                format: int32
                type: integer
              nodes:
                items:
                  description: NodeAvailability is the capacity of one node for an
                    instance type.
                  properties:
                    free:
                      format: int32
                      type: integer
                    node:
                      type: string
                    total:
                      format: int32
                      type: integer
                  required:
                  - free
                  - node
                  - total
                  type: object
                type: array
              total:
                description: total is how many instances fit on schedulable nodes
                  when empty.
                format: int32
                type: integer
              updateTime:
                format: date-time
                type: string
            required:
            - free
            - total
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources:
      status: {}
