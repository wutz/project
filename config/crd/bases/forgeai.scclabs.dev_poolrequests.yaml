---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.22.0
  name: poolrequests.forgeai.scclabs.dev
spec:
  group: forgeai.scclabs.dev
  names:
    categories:
    - forgeai
    kind: PoolRequest
    listKind: PoolRequestList
    plural: poolrequests
    shortNames:
    - fpr
    singular: poolrequest
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.requestID
      name: Request
      type: string
    - jsonPath: .spec.srcPool
      name: From
      type: string
    - jsonPath: .spec.dstPool
      name: To
      type: string
    - jsonPath: .spec.resourceID
      name: Resource
      type: string
    - jsonPath: .spec.nnodes
      name: Nodes
      type: integer
    - jsonPath: .status.phase
      name: Phase
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          PoolRequest moves idle nodes between node pools. The operator holds matching
          nodes with placeholder pods, then relabels them to dstPool.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: spec defines the desired state of PoolRequest
            properties:
              dstPool:
                default: default
                description: dstPool is the pool nodes are moved to.
                type: string
              nnodes:
                default: 1
                description: nnodes is the number of nodes to move.
                format: int32
                minimum: 1
                type: integer
              requestID:
                description: requestID is the user-facing request ID.
                maxLength: 40
                pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?$
                type: string
              resourceID:
                description: |-
                  resourceID selects node type (resource model labels) and the capacity
                  that must be free on each node.
                minLength: 1
                type: string
              srcPool:
                default: default
                description: srcPool is the pool nodes are taken from.
                type: string
              userID:
                description: userID is the platform user that requested the transfer.
                minLength: 1
                type: string
            required:
            - requestID
            - resourceID
            - userID
            type: object
          status:
            description: status defines the observed state of PoolRequest
            properties:
              completionTime:
                format: date-time
                type: string
              message:
                description: message explains the current phase (e.g. why placeholders
                  are not scheduled).
                type: string
              nodes:
                description: nodes moved to dstPool.
                items:
                  type: string
                type: array
              phase:
                description: PoolRequestPhase is Pending until all nodes are moved.
                enum:
                - Pending
                - Success
                - Failed
                type: string
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources:
      status: {}
