# This rule is not used by the project forgeai itself.
# It is provided to allow the cluster admin to help manage permissions for users.
#
# Grants read-only access to forgeai.scclabs.dev resources.
# This role is intended for users who need visibility into these resources
# without permissions to modify them. It is ideal for monitoring purposes and limited-access viewing.

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: forgeai
    app.kubernetes.io/managed-by: kustomize
  name: poolrequest-viewer-role
rules:
- apiGroups:
  - forgeai.scclabs.dev
  resources:
  - poolrequests
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - forgeai.scclabs.dev
  resources:
  - poolrequests/status
  verbs:
  - get
