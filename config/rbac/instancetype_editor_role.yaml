# This rule is not used by the project forgeai itself.
# It is provided to allow the cluster admin to help manage permissions for users.
#
# Grants permissions to create, update, and delete resources within the forgeai.scclabs.dev.
# This role is intended for users who need to manage these resources
# but should not control RBAC or manage permissions for others.

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: forgeai
    app.kubernetes.io/managed-by: kustomize
  name: instancetype-editor-role
rules:
- apiGroups:
  - forgeai.scclabs.dev
  resources:
  - instancetypes
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - forgeai.scclabs.dev
  resources:
  - instancetypes/status
  verbs:
  - get
