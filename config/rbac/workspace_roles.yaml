# Roles bound by the operator for Project members. Members are ServiceAccounts
# in project-members; "edit" or "view" is bound in the project namespace. The
# operator also creates project:project:<name>, granting members read access
# to their Project, its ClusterQueue, InstanceTypes and ClusterTrainingRuntimes.
#
# workspace-edit and workspace-view aggregate every ClusterRole labelled
# workspace.wutz.dev/aggregate-to-member=<role>. The rules here cover the
# third-party APIs the platform workloads use; a platform adds the rules for its
# own kinds with its own labelled ClusterRoles.
#
# Members cannot change quotas, network policies, RBAC or namespaces.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: workspace-edit
aggregationRule:
  clusterRoleSelectors:
  - matchLabels:
      workspace.wutz.dev/aggregate-to-member: edit
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: project-member-edit
  labels:
    workspace.wutz.dev/aggregate-to-member: edit
rules:
- apiGroups: [""]
  resources: [persistentvolumeclaims]
  verbs: [get, list, watch, create, update, patch, delete]
- apiGroups: [""]
  resources: [pods, pods/log, events, resourcequotas, limitranges, serviceaccounts, configmaps]
  verbs: [get, list, watch]
# Shells in the agent sandboxes the GUI opens (view members get none).
- apiGroups: [""]
  resources: [pods/exec]
  verbs: [create]
- apiGroups: [""]
  # Registry robot credentials.
  resources: [secrets]
  verbs: [get, list, watch]
- apiGroups: [events.k8s.io]
  resources: [events]
  verbs: [get, list, watch]
- apiGroups: [batch]
  resources: [jobs]
  verbs: [get, list, watch]
- apiGroups: [trainer.kubeflow.org]
  resources: [trainjobs, trainingruntimes]
  verbs: [get, list, watch, create, update, patch, delete]
- apiGroups: [jobset.x-k8s.io]
  resources: [jobsets]
  verbs: [get, list, watch]
- apiGroups: [kueue.x-k8s.io]
  resources: [localqueues, workloads]
  verbs: [get, list, watch]
# Agent sandboxes (SIG Apps agent-sandbox): members run their own sandboxes.
- apiGroups: [agents.x-k8s.io]
  resources: [sandboxes]
  verbs: [get, list, watch, create, update, patch, delete]
- apiGroups: [agents.x-k8s.io]
  resources: [sandboxes/status]
  verbs: [get]
- apiGroups: [extensions.agents.x-k8s.io]
  resources: [sandboxtemplates]
  verbs: [get, list, watch, create, update, patch, delete]
- apiGroups: [extensions.agents.x-k8s.io]
  resources: [sandboxclaims, sandboxwarmpools]
  verbs: [get, list, watch, create, update, patch, delete]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: workspace-view
aggregationRule:
  clusterRoleSelectors:
  - matchLabels:
      workspace.wutz.dev/aggregate-to-member: view
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: project-member-view
  labels:
    workspace.wutz.dev/aggregate-to-member: view
rules:
- apiGroups: [""]
  resources: [persistentvolumeclaims, pods, pods/log, events, resourcequotas, limitranges]
  verbs: [get, list, watch]
# The copy of the platform config the GUI reads; the operator writes it into each project.
- apiGroups: [""]
  resources: [configmaps]
  resourceNames: [workspace-platform]
  verbs: [get]
- apiGroups: [events.k8s.io]
  resources: [events]
  verbs: [get, list, watch]
- apiGroups: [batch]
  resources: [jobs]
  verbs: [get, list, watch]
- apiGroups: [trainer.kubeflow.org]
  resources: [trainjobs, trainingruntimes]
  verbs: [get, list, watch]
- apiGroups: [kueue.x-k8s.io]
  resources: [localqueues, workloads]
  verbs: [get, list, watch]
- apiGroups: [agents.x-k8s.io]
  resources: [sandboxes]
  verbs: [get, list, watch]
- apiGroups: [extensions.agents.x-k8s.io]
  resources: [sandboxtemplates, sandboxclaims, sandboxwarmpools]
  verbs: [get, list, watch]
