{{- if .Values.crd.enabled }}
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    {{- if .Values.crd.keep }}
    "helm.sh/resource-policy": keep
    {{- end }}
    controller-gen.kubebuilder.io/version: v0.22.0
  name: inferenceservices.forgeai.wutz.dev
spec:
  group: forgeai.wutz.dev
  names:
    categories:
    - forgeai
    kind: InferenceService
    listKind: InferenceServiceList
    plural: inferenceservices
    shortNames:
    - fisvc
    singular: inferenceservice
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.model
      name: Model
      type: string
    - jsonPath: .spec.instanceType
      name: Instance
      type: string
    - jsonPath: .spec.replicas
      name: Replicas
      type: integer
    - jsonPath: .status.readyReplicas
      name: Ready
      type: integer
    - jsonPath: .status.endpoint
      name: Endpoint
      type: string
    - jsonPath: .status.conditions[?(@.type=='Ready')].reason
      name: Status
      type: string
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          InferenceService serves a model with vLLM behind the llm-d router (the
          Endpoint Picker of the Gateway API Inference Extension), which balances
          requests by prefix-cache affinity and load. The API is OpenAI-compatible and
          requires the API key of the status. Stopping it (annotation
          forgeai.wutz.dev/stopped: "true") scales the replicas to zero.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: spec defines the desired state of InferenceService
            properties:
              args:
                description: args are extra arguments of vllm serve, e.g. --max-model-len
                  65536.
                items:
                  type: string
                type: array
              huggingFaceSecret:
                description: |-
                  huggingFaceSecret names a Secret of the namespace with an HF_TOKEN key,
                  needed for gated models.
                type: string
              image:
                description: image overrides the platform inference image (vLLM).
                type: string
              instanceType:
                description: |-
                  instanceType is the InstanceType of each model server replica. Its GPUs
                  are the tensor parallel size of the model.
                minLength: 1
                type: string
              model:
                description: model is the Hugging Face repository of the model to
                  serve, e.g. Qwen/Qwen3.8-27B-FP8.
                maxLength: 200
                minLength: 3
                pattern: ^[A-Za-z0-9][A-Za-z0-9._-]*/[A-Za-z0-9][A-Za-z0-9._-]*$
                type: string
              nodeSelector:
                additionalProperties:
                  type: string
                description: |-
                  nodeSelector pins the model server pods to nodes with these labels, on top
                  of the GPU product of instanceType. It is the way to avoid a node whose
                  GPU is free but whose runtime is broken.
                type: object
              replicas:
                default: 1
                description: |-
                  replicas is the number of model server replicas, each on instanceType.
                  Requests are balanced across the replicas by the llm-d router.
                format: int32
                minimum: 1
                type: integer
              servedModelName:
                description: |-
                  servedModelName is the name clients send as the model of a request.
                  Defaults to the repository name of model.
                maxLength: 200
                type: string
            required:
            - instanceType
            - model
            type: object
          status:
            description: status defines the observed state of InferenceService
            properties:
              apiKeySecret:
                description: |-
                  apiKeySecret names the Secret holding the API key (key api-key) that
                  clients send as a bearer token.
                type: string
              conditions:
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              endpoint:
                description: endpoint is the external URL of the OpenAI-compatible
                  API.
                type: string
              readyReplicas:
                description: readyReplicas is the number of model server replicas
                  that are ready.
                format: int32
                type: integer
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources:
      status: {}
{{- end }}
