# Member role bound in the project namespace (read only). It aggregates every
# ClusterRole labelled workspace.wutz.dev/aggregate-to-member=view.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: workspace-view
aggregationRule:
  clusterRoleSelectors:
  - matchLabels:
      workspace.wutz.dev/aggregate-to-member: view
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: project-member-view
  labels:
    workspace.wutz.dev/aggregate-to-member: view
rules:
- apiGroups:
  - ""
  resources:
  - persistentvolumeclaims
  - pods
  - pods/log
  - events
  - resourcequotas
  - limitranges
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - ""
  resources:
  - configmaps
  resourceNames:
  - workspace-platform
  verbs:
  - get
- apiGroups:
  - events.k8s.io
  resources:
  - events
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - batch
  resources:
  - jobs
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - trainer.kubeflow.org
  resources:
  - trainjobs
  - trainingruntimes
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - kueue.x-k8s.io
  resources:
  - localqueues
  - workloads
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - agents.x-k8s.io
  resources:
  - sandboxes
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - extensions.agents.x-k8s.io
  resources:
  - sandboxtemplates
  - sandboxclaims
  - sandboxwarmpools
  verbs:
  - get
  - list
  - watch
